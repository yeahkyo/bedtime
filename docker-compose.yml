services:
  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: bedtime_root
      MYSQL_DATABASE: bedtime
      MYSQL_USER: bedtime
      MYSQL_PASSWORD: bedtime
    ports:
      - "3307:3306"
    volumes:
      - bedtime_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - bedtime_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bedtime_minio:/data

  minio-init:
    profiles: ["minio"]
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/bedtime || true;
      exit 0;
      "

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      # Docker network hosts always win over host-oriented .env URLs
      DATABASE_URL: mysql+asyncmy://bedtime:bedtime@mariadb:3306/bedtime
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - api_data:/app/.data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  admin:
    profiles: ["admin"]
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX: ${DOCKER_REGISTRY_PREFIX:-docker.m.daocloud.io/library/}
        VITE_API_BASE: ${ADMIN_UI_API_BASE:-}
    ports:
      - "${ADMIN_UI_PORT:-8083}:80"
    depends_on:
      - api

volumes:
  bedtime_mariadb:
  bedtime_redis:
  bedtime_minio:
  api_data:
