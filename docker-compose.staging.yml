# Staging / online App testing — Cloudflare orange-cloud → origin HTTP port → uvicorn.
# Default host port 8080 so it can share a VPS with Bandage (which already owns :80).
# Cloudflare Origin Rule: bedtime-api hostname → origin port 8080.
# No source bind-mount, no --reload, DB/Redis not published.
#
# Prefer ./deploy.sh from a machine with apps/api/.env.staging (scp → remote .env).
# Manual: docker compose -p bedtime -f docker-compose.staging.yml --env-file apps/api/.env up -d --build

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bedtime_root}
      MYSQL_DATABASE: bedtime
      MYSQL_USER: bedtime
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bedtime}
    volumes:
      - bedtime_staging_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - bedtime_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    ports:
      # Co-locate with Bandage (:80). CF Origin Rule → this port. Override: API_HOST_PORT=80
      - "${API_HOST_PORT:-8080}:8000"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: mysql+asyncmy://bedtime:${MYSQL_PASSWORD:-bedtime}@mariadb:3306/bedtime
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dockerfile CMD (no --reload)
    restart: unless-stopped

  admin:
    # Browser talks to this nginx; /admin and /media are proxied to api:8000 on the
    # Compose network (keep ADMIN_UI_API_BASE empty so the SPA uses same-origin).
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX: ${DOCKER_REGISTRY_PREFIX:-}
        VITE_API_BASE: ${ADMIN_UI_API_BASE:-}
    ports:
      # Avoid Bandage admin :8081
      - "${ADMIN_UI_PORT:-8083}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Huhu legal / marketing: sibling repo ../Lullvale (not this compose).

volumes:
  bedtime_staging_mariadb:
  bedtime_staging_redis:
