name: bedtime_mobile
description: 呼呼 - 枕边故事 — personalized bilingual bedtime stories
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  audio_session: ^0.1.25
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  record: ^6.0.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  flutter_native_splash: ^2.4.6
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path: ^1.9.1
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.31.0
  build_runner: ^2.4.15

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  # logo is already a full-bleed square; keep opaque background for iOS
  remove_alpha_ios: true

flutter_native_splash:
  color: "#080D1A"
  # Dark (extinguished) logo for native → Flutter ignite handoff.
  # Size/position patched to SplashColors.logoSize @ SplashLayout.logoCenterFraction.
  # Regenerate: bash tool/regenerate_native_splash.sh
  image: assets/branding/splash_logo_dark.png
  android_12:
    color: "#080D1A"
    icon_background_color: "#080D1A"
    image: assets/branding/splash_logo_dark.png
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/
